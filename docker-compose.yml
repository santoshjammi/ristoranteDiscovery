# ── RistoranteDiscovery — Docker Compose (multi-app VPS shape) ──
# Runs alongside other Ristorante-family apps on one shared Docker network
# (appnet) behind host-level NGINX. Ports bind to 127.0.0.1 so NGINX is the
# sole external ingress. The production dataset is the isolated real-only
# showcase DB (rtp-showcase.db) — never the synthetic dev.db.
#
# Shared network: create once with `docker network create appnet` and have
# every app's compose join it. Do NOT publish ports to the host for prod.

services:
  rdi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdi-backend
    restart: always
    ports:
      - "127.0.0.1:${PORT_BACKEND:-5040}:5001"
    volumes:
      - rdi-data:/app/data
    # Reach the host's Ollama (and any other host-bound service) from inside
    # the container. Without this, OLLAMA_HOST=http://localhost:11434 resolves
    # to the container itself and AI calls fail with ECONNREFUSED.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=5001
      - NODE_ENV=production
      # Production dataset = isolated real-only showcase DB (6 real restaurants)
      - DATABASE_URL=file:/app/data/rtp-showcase.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      # Local Ollama lives on the HOST, reachable via host.docker.internal.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_LIGHT_MODEL=${OLLAMA_LIGHT_MODEL:-}
      - OLLAMA_COMPLEX_MODEL=${OLLAMA_COMPLEX_MODEL:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    networks:
      - appnet

  rdi-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5040/api}
    container_name: rdi-frontend
    restart: always
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-3040}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - appnet
    depends_on:
      - rdi-backend

volumes:
  rdi-data:
    name: rdi-data

# Join the shared multi-app network. Create once on the host:
#   docker network create appnet
networks:
  appnet:
    external: true
    name: appnet
