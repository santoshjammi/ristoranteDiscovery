      - FAQ schema
      - Review schema
      - Combined entity graph generation
      - Opening hours normalization
      - Geo metadata formatting

    outputs:
      - JSON-LD
      - Structured entity graphs
      - Search-engine-readable metadata

  retrieval_snippet_engine:
    purpose: >
      Generate AI-search and conversational retrieval summaries.

    features:
      - AI snippet generation
      - Dish summaries
      - Ambience summaries
      - Audience summaries
      - Occasion summaries
      - Local recommendation summaries

    outputs:
      - AI Overview snippets
      - Voice assistant summaries
      - Conversational recommendation blocks

discoverability_scoring:

  scoring_dimensions:
