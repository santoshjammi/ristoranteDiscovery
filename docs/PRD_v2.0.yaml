    - Long-tail query visibility
    - Dish-level indexing growth
    - Conversational retrieval coverage
    - Voice-search retrieval success rate

  semantic_quality:
    - Entity completeness score
    - Intent alignment score
    - Structured metadata coverage
    - FAQ retrieval quality
    - Review enrichment density

  business:
    - Client retention rate
    - Discoverability score improvement
    - Organic traffic increase
    - AI citation frequency

platform_scope:

