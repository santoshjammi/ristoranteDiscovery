      - AI snippet generation
      - FAQ optimization
      - Search intent alignment
      - Local relevance optimization
      - Voice-search optimization

  scoring_layer:
    responsibilities:
      - Discoverability scoring
      - Semantic completeness scoring
      - Intent alignment scoring
      - Retrieval confidence scoring
      - Entity quality scoring

core_modules:

  menu_discoverability_engine:
    purpose: >
      Transform menus into retrieval-ready semantic entities.

    features:
      - PDF parsing
      - OCR extraction
      - Dish entity normalization
      - Ingredient extraction
      - Dietary tagging
      - Cuisine tagging
      - Meal classification
      - Allergen tagging
      - Dish relationship mapping
      - Dish discoverability scoring

    outputs:
      - Structured menu entities
      - JSON-LD menu schema
      - AI retrieval snippets
      - Dish-level indexable pages

  conversational_faq_engine:
    purpose: >
      Generate AI-search-friendly conversational answers.

    features:
      - Intent-aware FAQ generation
      - Voice-search optimization
      - Local conversational queries
      - Retrieval-focused answer formatting
      - Concise AI-answer generation
      - FAQ semantic clustering

    outputs:
      - FAQ schema
      - Voice snippets
      - Conversational retrieval blocks
      - AI-answer sections

  semantic_review_engine:
    purpose: >
      Extract contextual discovery intelligence from reviews.

    features:
      - Sentiment analysis
      - Context extraction
      - Audience identification
      - Use-case extraction
      - Emotional mapping
      - Dish popularity extraction
      - Ambience intelligence
      - Complaint clustering

    outputs:
      - Ambience descriptors
      - Audience metadata
      - Intent indicators
      - Conversational recommendation signals

  local_intent_engine:
    purpose: >
      Align restaurants with high-intent local discovery patterns.

    features:
      - Nearby landmark mapping
      - Neighborhood association
      - Occasion mapping
      - Time-based dining intent
      - Budget segmentation
      - Audience segmentation
      - Local query clustering

    outputs:
      - Intent-specific landing data
      - Geo-context metadata
      - Local retrieval enrichment

  schema_optimization_engine:
    purpose: >
      Build semantically consistent structured metadata.

    features:
