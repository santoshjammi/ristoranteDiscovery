```yaml id="tirde-discoverability-scoring-engine-v2"
discoverability_scoring_engine:
  name: TIRDE Explainable Discoverability Intelligence Engine
  version: 2.0
  category: Semantic Discoverability Scoring Framework

core_philosophy:

  mission:
    statement: >
      Build an explainable, evidence-backed,
      retrieval-oriented discoverability scoring engine
      for Indian restaurant optimization.

  principles:
    - scores_must_be_explainable
    - scores_must_be_actionable
    - scores_must_be_evidence_based
    - scores_must_improve_retrieval_probability
    - scores_must_not_reward_keyword_spam

  forbidden_patterns:
    - arbitrary_percentages
    - vanity_scores
    - keyword_density_scoring
    - content_length_scoring
    - fake_ai_confidence
    - opaque_algorithms

scoring_architecture:

  overall_discoverability_score:
    scale: 0_to_100

    weighted_categories:
      dish_recognition: 20
      ai_discoverability: 20
      restaurant_clarity: 15
      ai_search_visibility: 20
      dish_understanding: 15
      local_intent_alignment: 10

dish_recognition:

  purpose:
    statement: >
      Measure how effectively dishes can be identified,
      normalized, and retrieved by search systems.

  scoring_dimensions:

    canonical_dish_match:
      weight: 25

      evaluates:
        - canonical_names
        - alias_recognition
        - duplicate_resolution
        - cuisine_consistency

    dish_alias_coverage:
      weight: 15

      examples:
        - Butter Chicken vs Murgh Makhani
        - Veg Pulao vs Vegetable Pulao

    cuisine_origin_clarity:
      weight: 20

      evaluates:
        - regional_cuisine_mapping
        - cuisine_specificity
        - indian_cuisine_accuracy

    menu_structure_quality:
      weight: 20

      evaluates:
        - section_grouping
        - meal_type_grouping
        - dish_relationships

    discoverable_naming_quality:
      weight: 20

      evaluates:
        - semantic_clarity
        - ambiguity_reduction
        - retrieval_readiness

  evidence_output:
    - normalized_dishes_count
    - unidentified_dishes
    - weak_aliases
    - cuisine_conflicts

ai_discoverability:

  purpose:
    statement: >
      Measure readiness for conversational AI systems
      and AI-generated retrieval environments.

  scoring_dimensions:

    conversational_faq_quality:
      weight: 25

      evaluates:
        - conversational_language
        - concise_answers
        - ai_answer_quality

    semantic_richness:
      weight: 25

      evaluates:
        - ingredient_coverage
        - cuisine_context
        - dining_context
        - semantic_depth

    ai_snippet_quality:
      weight: 20

      evaluates:
        - concise_summaries
        - retrieval_clarity
        - recommendation_quality

    voice_search_readiness:
      weight: 15

      evaluates:
        - short_answers
        - spoken_query_alignment
        - conversational_phrasing

    structured_metadata_quality:
      weight: 15

      evaluates:
        - schema_consistency
        - metadata_completeness
        - semantic_relationships

restaurant_clarity:

  purpose:
    statement: >
      Measure how clearly the restaurant identity,
      cuisine, audience, and dining context are understood.

  scoring_dimensions:

    cuisine_identity_clarity:
      weight: 25

    ambience_definition:
      weight: 20

    audience_definition:
      weight: 15

    dining_intent_mapping:
      weight: 20

    menu_organization:
      weight: 20

  evaluates:
    - family_friendly
    - office_lunch
    - buffet_dining
    - vegetarian_friendly
    - authentic_regional_food

ai_search_visibility:

  purpose:
    statement: >
      Measure probability of appearing in
      conversational and AI-driven searches.

  scoring_dimensions:

    conversational_query_match:
      weight: 30

    long_tail_query_alignment:
      weight: 20

    locality_query_alignment:
      weight: 20

    dish_level_retrieval:
      weight: 15

    semantic_consistency:
      weight: 15

  simulated_queries:

    examples:
      - best biryani in Morrisville
      - dosa restaurants near RTP
      - vegetarian Indian buffet Cary
      - authentic Andhra food Raleigh
      - family Indian restaurants near me

  evidence_output:
    - matched_queries
    - weak_queries
    - missing_intents
    - locality_gaps

dish_understanding:

  purpose:
    statement: >
      Measure semantic understanding depth
      for individual dishes.

  scoring_dimensions:

    ingredient_clarity:
      weight: 25

    cuisine_context:
      weight: 20

    spice_level_detection:
      weight: 10

    dietary_classification:
      weight: 15

    pairing_relationships:
      weight: 15

    semantic_description_quality:
      weight: 15

  semantic_quality_rules:
    - avoid_generic_ai_fluff
    - avoid_keyword_stuffing
    - require_contextual_descriptions
    - require_retrieval_clarity

local_intent_alignment:

  purpose:
    statement: >
      Measure alignment with locality-specific dining intent.

  scoring_dimensions:

    locality_mapping:
      weight: 25

    landmark_relevance:
      weight: 20

    office_area_alignment:
      weight: 15

    family_dining_alignment:
      weight: 20

    neighborhood_relevance:
      weight: 20

  locality_contexts:
    - RTP_office_lunch
    - Cary_family_dining
    - Morrisville_Indian_food
    - Raleigh_buffet_searches

semantic_validation_engine:

  purpose:
    statement: >
      Validate semantic quality and retrieval usefulness.

  validation_rules:

    semantic_depth:
      checks:
        - ingredient_specificity
        - cuisine_specificity
        - contextual_descriptions
        - dining_context

    conversational_quality:
      checks:
        - natural_language
        - concise_answers
        - spoken_language_compatibility

    retrieval_quality:
      checks:
        - query_alignment
        - semantic_consistency
        - locality_relevance

    anti_spam_checks:
      checks:
        - keyword_stuffing
        - repetitive_descriptions
        - generic_ai_content
        - semantic_duplication

scoring_outputs:

  restaurant_level:

    outputs:
      - overall_discoverability_score
      - ai_visibility_score
      - dish_recognition_score
      - conversational_readiness_score
      - locality_alignment_score

  dish_level:

    outputs:
      - dish_discoverability_score
      - semantic_richness_score
      - ingredient_clarity_score
      - cuisine_specificity_score
      - retrieval_readiness_score

  faq_level:

    outputs:
      - conversational_quality_score
      - voice_search_score
      - ai_answer_score

evidence_generation:

  philosophy:
    statement: >
      Every score must provide evidence
      and actionable improvement suggestions.

  evidence_examples:

    dish_understanding:
      - missing_ingredients
      - weak_descriptions
      - ambiguous_dish_names

    ai_visibility:
      - missing_local_queries
      - poor_conversational_alignment
      - weak_snippet_quality

    locality_alignment:
      - missing_RTP_context
      - weak_family_dining_signals
      - poor_buffet_visibility

recommendation_engine:

  philosophy:
    statement: >
      Every low score must generate
      actionable recommendations.

  recommendation_structure:

    includes:
      - issue_detected
      - why_it_matters
      - impact_estimate
      - recommended_fix
      - one_click_action

  examples:

    weak_dish_description:
      recommendation: >
        Add ingredient-level descriptions
        for better conversational retrieval.

    weak_local_alignment:
      recommendation: >
        Add RTP office lunch context
        for nearby professional searches.

    weak_faqs:
      recommendation: >
        Generate concise voice-friendly FAQs
        for AI assistants.

confidence_system:

  purpose:
    statement: >
      Measure confidence in scoring accuracy.

  confidence_levels:
    - low
    - medium
    - high

  confidence_factors:
    - metadata_completeness
    - menu_quality
    - review_density
    - semantic_consistency
    - retrieval_validation

future_readiness:

  phase_2:
    additions:
      - embeddings_validation
      - retrieval_testing
      - vector_similarity_scoring
      - conversational_ai_simulation

  phase_3:
    additions:
      - real_search_feedback_loops
      - maps_visibility_tracking
      - ai_overview_tracking
      - conversational_search_monitoring

engineering_rules:

  mandatory:
    - every_score_must_be_explainable
    - every_score_must_have_evidence
    - every_score_must_generate_recommendations
    - every_score_must_be_semantically_grounded
    - every_score_must_improve_discoverability

  prohibited:
    - arbitrary_scoring
    - vanity_metrics
    - black_box_scoring
    - keyword_spam_rewards
    - fake_growth_visualizations

success_criteria:

  technical:
    - explainable_scores
    - evidence_based_scoring
    - stable_semantic_evaluation
    - accurate_query_alignment

  business:
    - restaurant_owner_trust
    - actionable_improvements
    - measurable_discoverability_growth
    - high_recommendation_adoption

  strategic:
    - scoring_becomes_core_moat
    - scoring_becomes_trusted
    - scoring_creates_retention
    - scoring_drives_discoverability_optimization
```

