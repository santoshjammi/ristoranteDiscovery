version: 1
repo: ristoranteDiscovery

defaults:
  timeout_s: 900
  shell: /bin/bash

gates:
  - id: backend-typecheck
    cmd: cd backend && npx tsc --noEmit
    kind: typecheck
    required: true
    timeout_s: 300
    description: Backend TypeScript compile check

  - id: backend-build
    cmd: cd backend && npm run build
    kind: build
    required: true
    timeout_s: 600
    description: Backend compile to dist

  - id: frontend-build
    cmd: cd frontend && npm run build
    kind: build
    required: true
    timeout_s: 900
    description: Next.js production build

  # SAI-1693: the previous script was `next lint`, but `next lint` was REMOVED in
  # Next 16 and no ESLint was installed at all (absent from the lockfile too), so
  # this gate could never have run. Now a real ESLint 9 flat config, correctness
  # rules only (the codebase had never been linted).
  - id: frontend-lint
    cmd: cd frontend && npx eslint . --quiet
    kind: lint
    required: true
    timeout_s: 300
    description: Frontend ESLint (correctness rules; warnings are advisory)

  # Unused identifiers are reported as warnings, not errors, because the codebase
  # predates any linter. A cleanup that tightens them is tracked separately.
  - id: frontend-typecheck
    cmd: cd frontend && npx tsc --noEmit
    kind: typecheck
    required: true
    timeout_s: 300
    description: Frontend TypeScript compile check

  # BLOCKED: Playwright adopts the Docker container on :3040 and would validate a
  # stale image. Needs port isolation first. Tracked as SAI-1692.
  - id: e2e
    cmd: cd e2e && npx playwright test
    kind: test
    required: true
    blocked_by: SAI-1692
    timeout_s: 1200
    description: Playwright E2E (stale-container risk until SAI-1692)

  # Advisory: scanner set incomplete (trivy missing). Tracked as SAI-1699.
  - id: security
    cmd: ./scripts/prebuild-scan.sh --repo .
    kind: check
    required: false
    blocked_by: SAI-1699
    timeout_s: 600
    description: Pre-build security gate (advisory until SAI-1699)
