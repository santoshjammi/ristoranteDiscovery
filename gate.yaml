version: 1
repo: ristoranteDiscovery

defaults:
  timeout_s: 900
  shell: /bin/bash

gates:
  - id: backend-typecheck
    cmd: cd backend && npx tsc --noEmit
    kind: typecheck
    required: true
    timeout_s: 300
    description: Backend TypeScript compile check

  - id: backend-build
    cmd: cd backend && npm run build
    kind: build
    required: true
    timeout_s: 600
    description: Backend compile to dist

  - id: frontend-build
    cmd: cd frontend && npm run build
    kind: build
    required: true
    timeout_s: 900
    description: Next.js production build

  # BLOCKED: `next lint` reads "lint" as a directory under Next 16 — the script
  # must be fixed first. Tracked as SAI-1693.
  - id: frontend-lint
    cmd: cd frontend && npx eslint .
    kind: lint
    required: true
    blocked_by: SAI-1693
    timeout_s: 300
    description: Frontend lint (script broken until SAI-1693)

  # BLOCKED: Playwright adopts the Docker container on :3040 and would validate a
  # stale image. Needs port isolation first. Tracked as SAI-1692.
  - id: e2e
    cmd: cd e2e && npx playwright test
    kind: test
    required: true
    blocked_by: SAI-1692
    timeout_s: 1200
    description: Playwright E2E (stale-container risk until SAI-1692)

  # ADDED after an independent verifier FALSIFIED this branch's first commit.
  # A spec imported `TEST_PASSWORD` while its helper still used the deleted `PWD`,
  # so all 22 tests in that file would have thrown ReferenceError. The verification
  # I originally ran — `playwright test --list` — reported 205 tests and exit 0 in
  # the SAME tree, because Playwright transpiles without type-checking. That was a
  # false green and this gate is the fix: an undefined identifier is invisible to
  # --list and only a type-check catches it.
  #
  # This was never possible before: e2e/tsconfig.json declares `types: ["node"]`
  # while `@types/node` was not installed, so tsc failed with TS2688 before it could
  # reach any spec. Both are fixed here.
  - id: e2e-typecheck
    cmd: cd e2e && npx tsc --noEmit
    kind: typecheck
    required: true
    timeout_s: 300
    description: E2E spec type check (catches undefined identifiers that --list cannot)

  # Advisory: scanner set incomplete (trivy missing). Tracked as SAI-1699.
  - id: security
    cmd: ./scripts/prebuild-scan.sh --repo .
    kind: check
    required: false
    blocked_by: SAI-1699
    timeout_s: 600
    description: Pre-build security gate (advisory until SAI-1699)
